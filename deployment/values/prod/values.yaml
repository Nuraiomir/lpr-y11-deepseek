# PROD. Пока не развёрнут: сервис это прототип, и до продуктива ему не
# хватает двух вещей, перечисленных в README в разделе «Чего не хватает до
# продуктива»: настоящего OCRM вместо тестового справочника и ключей доступа
# в Vault.
#
# Файл заполнен сознательно, а не оставлен пустым: когда дело дойдёт до
# продуктива, видно будет, что именно в нём отличается, а не придётся
# вспоминать заново.

name: "prod-example-team-example-service"

# Две реплики, а не одна. Состояние голосования живёт в памяти процесса и
# привязано к session_id, поэтому кадры одной сессии должны попадать на одну
# реплику: при переключении на другую голоса начнутся заново, и номер
# подтвердится на секунду позже. Это терпимо, но включать балансировку по
# sticky-сессиям всё же придётся, и до продуктива это надо решить.
replicaCount: 2

configmaps_envs:
    ENVIRONMENT: "prod"
    LOG_LEVEL: "INFO"
    SERVE_DEMO_PAGE: "false"
