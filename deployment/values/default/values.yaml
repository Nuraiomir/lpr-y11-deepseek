# Базовые значения. Окружения переопределяют отсюда только то, что у них
# действительно иначе.

name: "{env}-example-team-example-service"

replicaCount: 1

containerPort: 8080

# Ресурсы взяты из замеров, а не назначены на глаз.
#
# Память. Процесс держит в себе ТОЛЬКО детектор: распознаватель работает по
# сети, и его веса в память не грузятся. Это заметно меньше, чем было с
# локальным распознавателем, где процесс занимал 1,3-2 ГБ. Числа ниже
# поставлены с запасом и должны быть УТОЧНЕНЫ замером на живом сервисе: пока
# они не измерены, это оценка, а не факт. Предел выше запроса потому, что
# под, убитый по памяти, теряет все сессии голосования, а не только кадр.
#
# Процессор. Запрос 1 ядро, предел 2. При ORT_THREADS=1 сервис и так считает
# в один поток, а второе ядро нужно на всё остальное: приём кадра, разбор
# JPEG, сериализация ответа. Выше поднимать нет смысла, пока не измерено, что
# это что-то даёт: см. раздел «Производительность» в README.
resources:
    requests:
        cpu: "1"
        memory: "1536Mi"
    limits:
        cpu: "2"
        memory: "2560Mi"

# Пробы. live и ready смотрят в разные места нарочно, и это не формальность:
# модели грузятся несколько секунд, и если live будет ждать готовности,
# кластер убьёт под на середине загрузки и начнёт заново.
livenessProbe:
    httpGet:
        path: /health/live
        port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

readinessProbe:
    httpGet:
        path: /health/ready
        port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    # Загрузка моделей на CPU занимает секунды, но на холодном узле может
    # занять дольше. Пока проба не прошла, трафика на под нет, так что
    # терпеливый порог здесь ничего не стоит.
    failureThreshold: 30

# Секреты из Vault: openshift/data/prod.aida.bcc.kz/<namespace>/<name>.
# Сервису оттуда нужен один ключ, LPR_API_KEYS, список ключей доступа через
# запятую. Пока путь в Vault не заполнен, строка ниже закомментирована, и
# сервис работает без проверки ключа, о чём пишет в журнал при запуске.
#
# Ключи в репозиторий не попадают ни в каком виде. Ключ, попавший в историю
# git один раз, остаётся в ней и после удаления из файлов.
# shared:
#     externalsecret: v1
# vault_secrets: {}

configmaps_envs:
    LOG_LEVEL: "INFO"
    # Модель лежит в образе (12 МБ, под версионным контролем). Когда она
    # переедет в реестр моделей в S3, здесь появится путь к смонтированному
    # каталогу, а в этом файле блок modelStaging: см. README.
    MODEL_PATH: "/app/model/best11n_512.onnx"
    LPR_DEVICE: "cpu"
    # Порог уверенности детектора. Измерен для текущих весов: см. комментарий
    # в app/lpr/detector.py. Переобучили модель, значит измеряйте заново.
    LPR_DETECT_CONF: "0.40"
    # Библиотеки считают потоки по ядрам УЗЛА, а не по квоте контейнера. При
    # квоте в одно ядро это десятки потоков на одно ядро, и время уходит на
    # переключение между ними, а не на счёт.
    ORT_THREADS: "1"
    # Адрес шлюза, через который читаются символы. Ключ сюда НЕ кладётся,
    # он приходит из Vault: см. блок vault_secrets выше.
    # LPR_GATEWAY_URL: "https://.../v1"
    LPR_GATEWAY_MODEL: "deepseek-ocr-2/deepseek-ocr-2"
    # Секунд на один вызов шлюза. Медиана ответа около 150 мс, так что десять
    # секунд это не ожидание в норме, а предел на случай, когда шлюз завис:
    # без предела запрос висел бы, занимая единственное ядро.
    LPR_GATEWAY_TIMEOUT: "10"
    # Вырез отправляется как есть. Увеличение до 1024 точек проверено
    # замером: плюс два правильных чтения из ста и в два с половиной раза
    # медленнее, то есть не стоит того. 0 означает «как есть».
    LPR_GATEWAY_UPSCALE: "0"
