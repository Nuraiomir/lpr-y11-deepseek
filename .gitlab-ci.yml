# CI по золотому пути платформы AIDA. Один include, остальное приходит из
# мета-компонента: линтер, проверка типов, поиск секретов, тесты, сборка и
# сканирование образа, aida validate, деплой.
#
# Что когда происходит:
#   MR открыт              проверки, тесты, aida validate, сборка без push
#   влито в test           тесты, сборка и push <short-sha>, деплой в TEST
#   влито в main           тесты, сборка и push, деплой в PROD вручную
#   тег v*                 сборка и push <tag>, деплой в PROD вручную
#
# Своих job здесь нет нарочно: мета-компонент уже описывает всё, что нужно
# этому сервису. То, что относится именно к нему, задано не здесь, а там, где
# это читается: тесты, которым нужны настоящие модели, отключены маркером в
# pyproject.toml (в сборочном окружении моделей нет, и скачивать их в CI
# означало бы поставить сборку в зависимость от сети), а параметры деплоя
# лежат в deployment/.
include:
  - component: $CI_SERVER_FQDN/artificial-intelligence-development-administration/ci-templates/standard-service@v4.8.2
