[project]
name = "example-service"
version = "0.1.0"
description = "Распознавание номерных знаков для активности «Выезд на место»"
requires-python = ">=3.12"

# Что нужно сервису, чтобы работать. Разделение на две группы здесь не
# косметика: всё из первой группы попадает в образ, и каждая строка это вес
# образа, время сборки и площадь для уязвимостей.
#
# Чего здесь НЕТ и почему:
#   ultralytics  обучает детектор и экспортирует модель, но сервис грузит
#                готовый .onnx через ONNX Runtime. В образе её нет, и
#                лицензионный вопрос AGPL до сервиса не доходит. Для
#                обучения она ставится отдельно, см. training/.
#   torch        нужен только для обучения, в сервисе не используется.
#   локальный распознаватель символов
#                не нужен вовсе: символы читает модель в кластере по сети.
#                Это снимает примерно гигабайт зависимостей и столько же из
#                размера образа.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "python-multipart>=0.0.12",
    # CPU-сборка. Требование банка это работа на процессоре, и GPU-сборка
    # потянула бы несколько гигабайт библиотек CUDA, которым в кластере
    # нечего делать.
    "onnxruntime>=1.20,<2.0",
    # headless, а не обычный opencv-python: сервис рисует на кадрах и
    # кодирует их, но окон не открывает, а на сервере их и открыть негде.
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.0",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: длина строки проверяется line-length выше, дублировать незачем.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# В FastAPI значения по умолчанию у параметров это вызовы Depends, Query и
# подобных: так описывается, откуда параметр берётся. Правило B008 запрещает
# вызовы в значениях по умолчанию, потому что обычно это общий изменяемый
# объект на все вызовы, но здесь объекты неизменяемые и это штатный способ
# описать запрос.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.File", "fastapi.Form", "fastapi.Body", "fastapi.Cookie",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Строгость наращивается постепенно. Включить всё сразу на перенесённом коде
# означает получить сотни замечаний и выключить проверку целиком.
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: нужны настоящие модели, несколько секунд на запуск",
]
# По умолчанию тесты с моделями пропускаются: в сборочном окружении моделей
# нет, и скачивать их в CI означало бы поставить сборку в зависимость от
# сети. На машине, где модели есть, они запускаются явно:
#     uv run pytest -m models
addopts = "-m 'not models'"
